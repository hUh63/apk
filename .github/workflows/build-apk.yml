name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify fixed signing key (CN=Taffy, C=CN)
        run: |
          test -f android/app/proxypin-release.jks
          test -f android/key.properties
          keytool -list -keystore android/app/proxypin-release.jks -storepass taffy2024 -alias proxypin | grep "CN=Taffy"

      - name: Build Universal APK (all architectures)
        run: flutter build apk --release

      - name: Rename universal APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/proxypin-universal.apk

      - name: Build Split APKs (per architecture)
        run: flutter build apk --release --split-per-abi

      - name: Rename split APKs
        run: |
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/.*app-(.*)-release\.apk/\1/')
            mv "$f" "build/app/outputs/flutter-apk/proxypin-${abi}.apk"
          done

      - name: List all built APKs
        run: ls -lh build/app/outputs/flutter-apk/proxypin-*.apk

      - name: Upload all APKs as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: proxypin-all-apks
          path: |
            build/app/outputs/flutter-apk/proxypin-universal.apk
            build/app/outputs/flutter-apk/proxypin-armeabi-v7a.apk
            build/app/outputs/flutter-apk/proxypin-arm64-v8a.apk
            build/app/outputs/flutter-apk/proxypin-x86_64.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/flutter-apk/proxypin-universal.apk
            build/app/outputs/flutter-apk/proxypin-armeabi-v7a.apk
            build/app/outputs/flutter-apk/proxypin-arm64-v8a.apk
            build/app/outputs/flutter-apk/proxypin-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}