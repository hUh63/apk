name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify fixed signing key (CN=Taffy, C=CN)
        run: |
          test -f android/app/proxypin-release.jks
          test -f android/key.properties
          keytool -list -v -keystore android/app/proxypin-release.jks -storepass taffy2024 -alias proxypin | grep -i "Taffy"

      - name: Build Universal APK (all architectures)
        run: flutter build apk --release

      - name: Extract version (upstream #917)
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | head -1 | sed 's/version: //' | tr -d ' ')
          echo "app_version=$VER" >> "$GITHUB_OUTPUT"
          echo "version extracted: $VER"

      - name: Rename universal APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/proxypin-${{ steps.version.outputs.app_version }}-universal.apk"

      - name: Build Split APKs (per architecture)
        run: flutter build apk --release --split-per-abi

      - name: Rename split APKs
        run: |
          VER="${{ steps.version.outputs.app_version }}"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/.*app-(.*)-release\.apk/\1/')
            mv "$f" "build/app/outputs/flutter-apk/proxypin-${VER}-${abi}.apk"
          done

      - name: List all built APKs
        run: ls -lh build/app/outputs/flutter-apk/proxypin-*.apk

      - name: Upload all APKs as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: proxypin-all-apks
          path: build/app/outputs/flutter-apk/proxypin-*.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: build/app/outputs/flutter-apk/proxypin-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}