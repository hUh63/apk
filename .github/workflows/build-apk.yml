name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APK_DIR: build/app/outputs/flutter-apk

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/debug-keystore.jks \
            -storetype JKS \
            -keyalg RSA \
            -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,ST=Debug,C=US" \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -validity 10000

      - name: Create key.properties
        run: |
          echo "storePassword=android" > android/key.properties
          echo "keyPassword=android" >> android/key.properties
          echo "keyAlias=androiddebugkey" >> android/key.properties
          echo "storeFile=debug-keystore.jks" >> android/key.properties

      - name: Build Universal APK (all architectures)
        run: flutter build apk --release

      - name: Rename universal APK
        run: |
          mv $APK_DIR/app-release.apk $APK_DIR/proxypin-universal.apk

      - name: Build Split APKs (per architecture)
        run: flutter build apk --release --split-per-abi

      - name: Rename split APKs
        run: |
          for f in $APK_DIR/app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's/.*app-(.*)-release\.apk/\1/')
            mv "$f" "$APK_DIR/proxypin-${abi}.apk"
          done

      - name: List all built APKs
        run: ls -lh $APK_DIR/proxypin-*.apk

      - name: Upload all APKs as artifacts
        uses: actions/upload-artifact@v6
        with:
          name: proxypin-all-apks
          path: |
            $APK_DIR/proxypin-universal.apk
            $APK_DIR/proxypin-armeabi-v7a.apk
            $APK_DIR/proxypin-arm64-v8a.apk
            $APK_DIR/proxypin-x86_64.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            $APK_DIR/proxypin-universal.apk
            $APK_DIR/proxypin-armeabi-v7a.apk
            $APK_DIR/proxypin-arm64-v8a.apk
            $APK_DIR/proxypin-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}